<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>PhotoLite - AI Passport Photo Compressor</title>


<meta name="description" content="AI passport photo maker with white background and 25KB image compressor">


<meta name="keywords" content="passport photo, 25KB photo, image compressor, white background photo">


<link rel="stylesheet" href="style.css">


<!-- AI Background Removal Library -->
<script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>


<!-- ZIP Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>


</head>



<body>



<div class="container">



<button id="darkBtn">
🌙 Dark Mode
</button>




<div class="brand">

<h1>
📷 PhotoLite
</h1>

<p>
AI Passport Photo Maker & Image Compressor
</p>

</div>





<div class="card">



<label>
Select Image
</label>


<input 
type="file"
id="imageInput"
accept="image/*"
multiple
>




<label>
Target File Size
</label>


<select id="targetSize">

<option value="25">
25 KB
</option>


<option value="50">
50 KB
</option>


<option value="100">
100 KB
</option>


</select>





<label>
Width (px)
</label>


<input 
type="number"
id="width"
value="600"
>





<label>
Height (px)
</label>


<input 
type="number"
id="height"
value="800"
>





<button id="compressBtn">

Compress Photo

</button>





<button id="batchBtn">

Compress All Photos

</button>





<button id="zipBtn">

Download ZIP

</button>





<button id="resetBtn" class="reset">

Reset

</button>





<div id="progressBox">

Ready

</div>



</div>






<div class="preview">



<h2>
Preview
</h2>



<canvas id="canvas"></canvas>



<p id="fileInfo"></p>




<a 
id="downloadBtn"
download="passport-photo.jpg"
>

Download Photo

</a>



</div>





</div>





<script src="script.js"></script>



</body>


</html>
